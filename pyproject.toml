[project]
name = "spin-tails"
version = "0.1.0"
description = "A local audiobook production studio and read-along library"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115,<1",
    "uvicorn>=0.34,<1",
    "python-multipart>=0.0.20,<1",
    "httpx>=0.28,<1",
    "defusedxml>=0.7.1,<1",
    "python-dotenv>=1.2,<2",
    "pillow>=12.3,<13",
]

[dependency-groups]
dev = ["pytest>=8,<10"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
